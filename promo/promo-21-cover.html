<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Dev Club #21 - Wrapper na miniaturkę</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --black: #050510;
            --white: #ffffff;
            --yellow: #f5d142; /* Standardowy żółty Better Dev Club */
            --accent: #00ff9d; /* Neon dla cyber-sec, można zmienić na yellow */
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Oswald', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 1200px;
            height: 627px;
            display: flex;
            flex-direction: column;
            background: var(--black);
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Sekcja na miniaturkę z YouTube (1200x537) */
        .cover-image-placeholder {
            width: 100%;
            height: 537px;
            background-image: url('https://i.ytimg.com/vi/JEtqTZ9QsEo/maxresdefault.jpg'); 
            background-size: cover;
            background-position: center 30%;
            position: relative;
        }

        /* Footer CTA - belka na dole (wysokość 90px) */
        .footer-cta {
            width: 100%;
            height: 90px;
            background: #000;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 200;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .cta-text {
            font-size: 34px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        .cta-text span {
            background: var(--accent);
            padding: 4px 15px;
            color: #000;
            margin-left: 15px;
            border-radius: 4px;
        }

        .platforms {
            display: flex;
            gap: 15px;
        }

        .platform-icon {
            font-size: 32px;
            background: var(--accent);
            color: #000;
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Wrappowanie miniatury -->
        <div class="cover-image-placeholder"></div>

        <!-- Klasyczna belka z CTA -->
        <div class="footer-cta">
            <div class="cta-text">
                NOWY ODCINEK: <span>LINK W KOMENTARZU 👇</span>
            </div>
            <div class="platforms">
                <div class="platform-icon"><i class="fa-brands fa-youtube"></i></div>
                <div class="platform-icon"><i class="fa-brands fa-spotify"></i></div>
                <div class="platform-icon"><i class="fa-brands fa-apple"></i></div>
            </div>
        </div>
    </div>

</body>
</html>
