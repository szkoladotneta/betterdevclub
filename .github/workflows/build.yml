name: Build and Deploy SSR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run build_transcription_json.py
        run: python tools/build_transcription_json.py

      - name: Run build_ssr.py
        run: python tools/build_ssr.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated build: Updated transcription and SSR files [skip ci]"
          # Optional: specify files to commit, or let it commit everything
          file_pattern: 'transcriptions/*.json episodes/*.html'
