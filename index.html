                    const isSubpage = window.location.pathname.includes('/episodes/');
                    const basePath = isSubpage ? '../transcriptions/' : 'transcriptions/';
                    
                    // Try different formats: 001.json, 01.json, 1.json
                    const formats = [
                        num.padStart(3, '0'),
                        num.padStart(2, '0'),
                        num
                    ];
                    
                    for (const f of formats) {
                        try {
                            const response = await fetch(`${basePath}${f}.json`);
                            if (response.ok) {
                                const data = await response.json();
                                setTranscript(data.transcript);
                                return;
                            }
                        } catch (e) {}
                    }
                    console.error("Transcript not found for episode", num);

                    setTranscript(null);
                    loadTranscript();

                // Case-insensitive name lookup if key is a full name

                    const name = s.name.toLowerCase();
                    return name === lowerKey || 
                           name === lowerKey.replace('piotrek', 'piotr') ||
                           name === lowerKey.replace('piotr', 'piotrek') ||

                                    </nav>

                                    {guest && guest.role !== 'Host' && (
                                        <div className="p-6 bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-slate-800">
                                            <h4 className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-4">O Gościu</h4>
                                            <div className="flex items-center gap-3 mb-3">
                                                <div className="size-12 rounded-lg bg-slate-200 dark:bg-slate-700 bg-cover border border-slate-200 dark:border-slate-800" style={{backgroundImage: `url("${guest.picture}")`}}></div>
                                                <div>
                                                    <p className="font-bold text-sm dark:text-white">{guest.name}</p>
                                                    <p className="text-xs text-slate-500 dark:text-slate-400">{guest.guestRole || guest.role}{guest.company ? ` @ ${guest.company}` : ''}</p>
                                                </div>
                                            </div>
                                            <p className="text-xs text-slate-600 dark:text-slate-400 leading-normal">
                                                {guest.bio}
                                            </p>
                                        </div>
                                    )}
                                </div>
                            </aside>
                        </div>
                    </main>
                    <GlobalFooter />
                </div>
            );
        };

        const ScrollToTop = () => {
            const { pathname } = useLocation();
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [pathname]);
            return null;
        };

        const Bootstrapper = () => {
            const navigate = useNavigate();
            const location = useLocation();
            useEffect(() => {
                if (window.INITIAL_ROUTE) {
                    const route = window.INITIAL_ROUTE;
                    window.INITIAL_ROUTE = null;
                    
                    // Update the browser URL to reflect the clean route
                    // We use replaceState to keep history clean when transitioning from static to SPA
                    if (window.location.pathname.includes('/episodes/')) {
                        const cleanRoute = route.startsWith('/') ? route.substring(1) : route;
                        window.history.replaceState(null, '', '../' + cleanRoute);
                    }
                    
                    navigate(route, { replace: true });
                }
            }, []);
            return null;
        };

        const App = () => {
            const [episodes, setEpisodes] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const version = "7ddad1a435";
                Promise.all([
                    fetch(`/episodes.json?v=${version}`).then(res => res.json()),
                    fetch(`/speakers.json?v=${version}`).then(res => res.json())
                ]).then(([episodesData, speakersData]) => {
                    window.EPISODES_DATA = episodesData;
                    window.SPEAKERS_DATA = speakersData;
                    setEpisodes(episodesData);
                    setLoading(false);
                }).catch(err => {
                    console.error("Failed to load data:", err);
                    setLoading(false);
                });
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-background-light dark:bg-background-dark text-primary font-bold">
                        <div className="flex flex-col items-center gap-4">
                            <div className="size-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                            <p>Wczytywanie BetterDevClub (deployment w toku)...</p>
                        </div>
                    </div>
                );
            }

            return (
                <BrowserRouter>
                    <Bootstrapper />
                    <ScrollToTop />
                    <Routes>
                        <Route path="/" element={<HomePage episodes={episodes} />} />
                        <Route path="/episodes" element={<EpisodesPage episodes={episodes} />} />
                        <Route path="/episodes/episode-:num" element={<EpisodeDetailPage episodes={episodes} />} />
                    </Routes>
                </BrowserRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- SSR Templates for build.py - Keep these in sync with React components above -->
    <template id="ssr-episode-item">
        <div class="flex flex-col md:flex-row gap-6 bg-white dark:bg-card-dark p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-white/5 hover:border-primary/50 transition-all group">
            <div class="flex items-start gap-5 flex-1">
                <div class="text-primary flex items-center justify-center rounded-2xl bg-primary/10 shrink-0 size-16 group-hover:bg-primary group-hover:text-white transition-all duration-300 shadow-inner">
                    <span class="material-symbols-outlined text-4xl">play_circle</span>
                </div>
                <div class="flex flex-1 flex-col">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-primary text-xs font-black uppercase tracking-widest">Odcinek {{NUM}}</span>
                        <span class="text-slate-300 dark:text-slate-700 font-bold">•</span>
                        <span class="text-slate-500 dark:text-slate-400 text-xs font-semibold">{{DATE}}</span>
                    </div>
                    <h3 class="text-slate-900 dark:text-white text-2xl font-bold leading-tight group-hover:text-primary transition-colors cursor-pointer">{{TITLE}}</h3>
                    <p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed mt-3 line-clamp-2">{{DESC}}</p>
                    <div class="flex gap-3 mt-5">{{TAGS}}</div>
                </div>
            </div>
            <div class="flex md:flex-col justify-between md:justify-center items-center gap-4">
                <button class="flex min-w-[130px] cursor-pointer items-center justify-center rounded-xl h-11 px-6 bg-slate-100 dark:bg-white/5 text-slate-900 dark:text-white text-sm font-bold hover:bg-primary hover:text-white transition-all">Słuchaj teraz</button>
            </div>
        </div>
    </template>

    <template id="ssr-episode-detail">
        <div class="max-w-[960px] mx-auto px-4 py-10">
            <div class="mb-8">
                <p class="text-primary font-bold text-sm tracking-wider uppercase mb-2">Odcinek #{{NUM}}</p>
                <h1 class="text-[#0d171b] dark:text-white text-4xl font-black">{{TITLE}}</h1>
                <p class="text-slate-500 mt-2">{{DATE}} • {{DURATION}}</p>
            </div>
            <div class="prose prose-slate dark:prose-invert max-w-none text-slate-600 dark:text-slate-300 leading-relaxed mb-12">
                <p>{{DESC}}</p>
            </div>
        </div>
    </template>
</body>
</html>
